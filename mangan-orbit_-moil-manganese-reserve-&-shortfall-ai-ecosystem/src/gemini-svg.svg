<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Optional Dark Tile Background -->
  <rect width="400" height="120" rx="16" fill="url(#bgGrad)" />

  <!-- Logo Mark Group -->
  <g transform="translate(15, 10)">
    <!-- Orbit Ellipse -->
    <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-25 50 50)" opacity="0.8" />
    
    <!-- Stylized 'M' Construct -->
    <path d="M 32 68 L 32 35 L 50 52 L 68 35 L 68 68" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Orbiting Satellite Node -->
    <circle cx="82" cy="30" r="5" fill="#06B6D4" filter="url(#glow)" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(115, 45)">
    <text x="0" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#FFFFFF">
      MANGAN
    </text>
    <text x="162" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="28" letter-spacing="1.5" fill="#06B6D4">
      ORBIT
    </text>
    <text x="2" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" letter-spacing="3.5" fill="#94A3B8">
      DASHBOARD & ECOSYSTEM
    </text>
  </g>
</svg>
